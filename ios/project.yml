# XcodeGen spec. `scripts/xcode.sh` turns it into TERRA.xcodeproj (generated, not committed).
name: TERRA
options:
  bundleIdPrefix: com.zappika
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 8D6ML34D52
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"    # overridden with the commit count by scripts
targets:
  TERRA:
    type: application
    platform: iOS
    sources:
      - path: TERRA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zappika.terra
        PRODUCT_NAME: TERRA
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TERRA
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: TERRA uses your location as the start of the walking route it sends to your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  TERRATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TERRATests
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: TERRA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zappika.terra.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TERRA.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TERRA
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TERRA:
    build:
      targets:
        TERRA: all
        TERRATests: [test]
    test:
      targets:
        - TERRATests
