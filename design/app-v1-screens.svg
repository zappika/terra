  <text x="661" y="48" fill="#2b3a30" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="24" font-weight="700">02  Route preview</text>
  <rect x="129" y="74" width="338" height="658" rx="48" fill="#23372e" filter="url(#shadow)"/>
  <rect x="653" y="74" width="338" height="658" rx="48" fill="#23372e" filter="url(#shadow)"/>
  <g clip-path="url(#left-screen)" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
