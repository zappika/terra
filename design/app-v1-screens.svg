    <text x="687" y="547" fill="#788476" font-size="12">Passeig de Picasso, Barcelona</text>
    <line x1="687" y1="566" x2="957" y2="566" stroke="#e2e5dc"/>
    <text x="687" y="599" fill="#263b2e" font-size="22" font-weight="700">2.1 km</text>
    <text x="789" y="599" fill="#263b2e" font-size="22" font-weight="700">28 min</text>
    <rect x="682" y="627" width="280" height="62" rx="20" fill="#447358"/>
    <text x="742" y="666" fill="#fffefa" font-size="16" font-weight="700">Send to TERRA</text>
  </g>
  <text x="137" y="763" fill="#647464" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13">Search here, or import a destination from an Apple Maps share link.</text>
