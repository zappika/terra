<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-label="Two TERRA iPhone app screen concepts: find a place and preview a walking route">
  <defs>
    <pattern id="map" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="#e8eadf"/>
      <path d="M-10 27 L150 43 M-10 103 L150 83 M18 -10 L40 150 M101 -10 L88 150" fill="none" stroke="#f8f7f1" stroke-width="15"/>
      <path d="M-10 27 L150 43 M-10 103 L150 83 M18 -10 L40 150 M101 -10 L88 150" fill="none" stroke="#d7dbcd" stroke-width="1"/>
      <path d="M50 50 C75 30 90 35 111 50 L115 70 C90 77 77 72 53 84 Z" fill="#d4decf" opacity=".8"/>
    </pattern>
    <clipPath id="left-screen"><rect x="137" y="82" width="322" height="642" rx="40"/></clipPath>
    <clipPath id="right-screen"><rect x="661" y="82" width="322" height="642" rx="40"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#263e32" flood-opacity=".17"/></filter>
