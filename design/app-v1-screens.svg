    <rect x="153" y="173" width="290" height="48" rx="15" fill="#fffefa" stroke="#d7ddd2"/>
    <circle cx="177" cy="197" r="7" fill="none" stroke="#5d7760" stroke-width="2"/>
    <path d="M182 202 l6 6" stroke="#5d7760" stroke-width="2" stroke-linecap="round"/>
    <text x="200" y="202" fill="#6a766a" font-size="14">Search an address or place</text>
    <path d="M232 334 C249 324 265 327 278 340 C292 354 311 353 327 340 C346 324 360 328 369 344" fill="none" stroke="#a6b8a2" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 11"/>
    <circle cx="300" cy="343" r="13" fill="#fffefa" stroke="#49735b" stroke-width="3"/>
    <circle cx="300" cy="343" r="5" fill="#49735b"/>
    <rect x="153" y="608" width="290" height="95" rx="21" fill="#fffefa"/>
    <circle cx="183" cy="642" r="10" fill="#dce9dc"/>
