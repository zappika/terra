    <path d="M697 407C729 390 755 401 770 372S791 339 821 347 855 322 855 291 888 286 924 246" fill="none" stroke="#baf75e" stroke-width="19" opacity=".38" filter="url(#glow)"/>
    <path d="M697 407C729 390 755 401 770 372S791 339 821 347 855 322 855 291 888 286 924 246" fill="none" stroke="#baf75e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="697" cy="407" r="11" fill="#0b140e" stroke="#70e7df" stroke-width="3"/>
    <circle cx="924" cy="246" r="13" fill="#baf75e"/>
    <path d="M913 246h22M924 235v22" stroke="#0b140e" stroke-width="2"/>
    <text x="691" y="433" fill="#70e7df" font-family="monospace" font-size="9">START</text>
    <text x="891" y="222" fill="#baf75e" font-family="monospace" font-size="9">END</text>
    <rect x="658" y="75" width="324" height="130" fill="#080d0b" opacity=".9"/>
    <text x="683" y="109" fill="#d5d9c5" font-size="12" font-weight="700" letter-spacing="3">TERRA / 002</text>
    <text x="910" y="109" fill="#70e7df" font-family="monospace" font-size="10">← BACK</text>
    <path d="M682 123H958" stroke="#648864" stroke-width="1"/>
    <text x="679" y="164" fill="#baf75e" font-size="32" font-weight="900" letter-spacing="-2">PATH FOUND</text>
    <text x="683" y="185" fill="#70e7df" font-family="monospace" font-size="10" letter-spacing="2">TERRA ROUTE / WALKING</text>
    <path d="M658 472H982V735H658Z" fill="#0a110d" stroke="#536f50" stroke-width="1"/>
    <path d="M682 492H958" stroke="#648864" stroke-width="1"/>
    <text x="683" y="516" fill="#70e7df" font-family="monospace" font-size="10" letter-spacing="1">DESTINATION / BCN 001</text>
