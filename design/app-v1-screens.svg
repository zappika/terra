    <text x="683" y="568" fill="#8ca18a" font-family="monospace" font-size="10">PASSEIG DE PICASSO, BARCELONA</text>
    <path d="M682 580H958" stroke="#648864" stroke-width="1"/>
    <text x="682" y="615" fill="#baf75e" font-size="26" font-weight="900">2.1 KM</text>
    <text x="831" y="615" fill="#baf75e" font-size="26" font-weight="900">28 MIN</text>
    <path d="M682 635H958V696H682Z" fill="#baf75e"/>
    <path d="M688 641H952V690H688Z" fill="none" stroke="#101a10" stroke-width="1"/>
    <text x="705" y="665" fill="#101a10" font-size="19" font-weight="900" letter-spacing="1">TRANSMIT ROUTE</text>
    <text x="706" y="684" fill="#253525" font-family="monospace" font-size="10">SEND TO TERRA  →</text>
    <text x="683" y="718" fill="#8ca18a" font-family="monospace" font-size="10">DEVICE: NOT CONNECTED / TAP TO FIND</text>
    <rect x="658" y="75" width="324" height="660" filter="url(#grain)" opacity=".27"/>
  </g>
  <text x="138" y="780" fill="#8fa387" font-family="monospace" font-size="12" letter-spacing="1">SEARCH / PLACE IMPORT</text>
  <text x="658" y="780" fill="#8fa387" font-family="monospace" font-size="12" letter-spacing="1">ROUTE / TRANSMISSION</text>
</svg>
