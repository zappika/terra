<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-label="Two dark, phosphor-green TERRA iPhone screen concepts: destination search and walking-route preview">
  <defs>
    <radialGradient id="field"><stop stop-color="#203a26"/><stop offset=".58" stop-color="#101b15"/><stop offset="1" stop-color="#080d0b"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#48644a" stroke-width=".5" opacity=".32"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer></filter>
    <clipPath id="screen-a"><rect x="138" y="75" width="324" height="660" rx="34"/></clipPath>
    <clipPath id="screen-b"><rect x="658" y="75" width="324" height="660" rx="34"/></clipPath>
  </defs>
  <rect width="1120" height="820" fill="#080d0b"/>
  <path d="M0 100H1120M0 707H1120" stroke="#26392a" stroke-width="1"/>
  <text x="138" y="43" fill="#baf75e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">TERRA / INTERFACE STUDY 01</text>
  <text x="658" y="43" fill="#baf75e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">TERRA / INTERFACE STUDY 02</text>
  <rect x="130" y="67" width="340" height="676" rx="43" fill="#020504" stroke="#37563b" stroke-width="2"/>
  <rect x="650" y="67" width="340" height="676" rx="43" fill="#020504" stroke="#37563b" stroke-width="2"/>
  <g clip-path="url(#screen-a)" font-family="Arial, sans-serif">
    <rect x="138" y="75" width="324" height="660" fill="url(#field)"/>
    <rect x="138" y="75" width="324" height="660" fill="url(#grid)"/>
    <path d="M145 518C212 466 249 487 309 435S385 391 458 346M126 586C180 536 236 556 282 500S364 442 477 418" fill="none" stroke="#4d714c" stroke-width="2" opacity=".32"/>
    <circle cx="308" cy="452" r="130" fill="none" stroke="#729d67" stroke-width="1" opacity=".26"/>
    <circle cx="308" cy="452" r="85" fill="none" stroke="#729d67" stroke-width="1" opacity=".36"/>
    <circle cx="308" cy="452" r="39" fill="none" stroke="#baf75e" stroke-width="1" opacity=".56"/>
    <path d="M308 308V594M165 452H454" stroke="#97c781" stroke-width="1" opacity=".26"/>
    <path d="M289 452H327M308 433V471" stroke="#baf75e" stroke-width="2"/>
    <circle cx="308" cy="452" r="5" fill="#baf75e"/>
    <rect x="138" y="75" width="324" height="220" fill="#080d0b" opacity=".93"/>
    <text x="161" y="109" fill="#d5d9c5" font-size="12" font-weight="700" letter-spacing="3">TERRA / 001</text>
    <text x="400" y="109" fill="#70e7df" font-family="monospace" font-size="10">● LIVE</text>
    <path d="M161 123H440" stroke="#648864" stroke-width="1"/>
    <text x="158" y="190" fill="#baf75e" font-size="58" font-weight="900" letter-spacing="-5">WHERE</text>
    <text x="158" y="246" fill="#baf75e" font-size="58" font-weight="900" letter-spacing="-5">TO<span fill="#70e7df">?</span></text>
    <path d="M161 263H440" stroke="#baf75e" stroke-width="2"/>
    <text x="163" y="284" fill="#d5d9c5" font-family="monospace" font-size="11" letter-spacing="1">ENTER DESTINATION  ▸</text>
