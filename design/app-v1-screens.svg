    <path d="M160 628H440" stroke="#658c5e" stroke-width="1"/>
    <text x="161" y="650" fill="#70e7df" font-family="monospace" font-size="10" letter-spacing="2">POSITION / ACQUIRED</text>
    <text x="161" y="678" fill="#d5d9c5" font-size="19" font-weight="800" letter-spacing="1">MY POSITION</text>
    <path d="M401 665l11 11 20-24" fill="none" stroke="#baf75e" stroke-width="2"/>
    <text x="161" y="712" fill="#7f9a7d" font-family="monospace" font-size="10">OR IMPORT A PLACE FROM MAPS ↗</text>
    <rect x="138" y="75" width="324" height="660" filter="url(#grain)" opacity=".27"/>
  </g>
  <g clip-path="url(#screen-b)" font-family="Arial, sans-serif">
    <rect x="658" y="75" width="324" height="660" fill="url(#field)"/>
    <rect x="658" y="75" width="324" height="660" fill="url(#grid)"/>
