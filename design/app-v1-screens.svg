    <circle cx="715" cy="390" r="11" fill="#fffefa" stroke="#447358" stroke-width="4"/>
    <circle cx="904" cy="218" r="15" fill="#447358" stroke="#fffefa" stroke-width="4"/>
    <circle cx="904" cy="218" r="4" fill="#fffefa"/>
    <rect x="661" y="446" width="322" height="278" rx="29" fill="#fdfcf7"/>
    <rect x="802" y="455" width="40" height="4" rx="2" fill="#d9ded4"/>
